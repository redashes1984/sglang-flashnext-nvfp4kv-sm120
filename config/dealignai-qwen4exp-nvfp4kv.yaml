# SGLang dealignai Qwen3.8-Flash-Next — NVFP4 KV 方案 (nvfp4kv)
# conc6 / 1M / nvfp4 KV / MTP OFF (1M 腾池, #1M-OFF 行为恢复锚点) / mamba 24 / radix ON / HiCache OFF / CG both eager (QSA spec-off 捕获守卫) / (prefill=triton)/(decode=trtllm_mha, GDN=flashinfer)
#   port 8000；served-model-name Qwen3.8-Flash-Next-NVFP4（Hindsight 路由键，禁改）
#   前置补丁：dspark QSA×fp4 (/opt/sglang-config/apply_nvfp4_patches.py) + sampler #37962 (标记 dspark-37962)
#   HiCache 必 OFF：#36121 fp4 scale buffer 不进 host 传输 → 驱逐回载后静默腐坏
#   radix ON 实测：同前缀 99.96% 命中、553K tok 驱逐压力后 needle 仍正确（scale 搬运路径无恙）
#   mamba 24 = radix ON 入场费（峰值 usage 0.62 ≈20 槽）+ 余量钉死；32 是未钉制的自动 sizing 结果，多余槽为死显存
#   与 fp8kv 方案互斥（单 GPU + PLE pinned 44GB），同时只跑一个；本 unit 故意不 enable，防开机抢 GPU
#   性能账本(2026-09-08 终版 GDN=flashinfer双端 + mamba24/KV851968 + prefill CG=full + FR-Spec表cov1.0 + MTP steps2/draft3 + ABL=extra_buffer_lazy + SAM=decode, 可复现热态)：C1≈136 t/s / C6≈550-575 t/s / prefill≈10K t/s / accept len≈2.0-2.3 rate≈0.5-0.66 / mamba峰值≤12槽 / KV池851968;注:EAGLE×FP4下prefill批次部分走eager(#28386);换表重置prefix cache namespace需预热2-3轮;MTP校准steps2为甜点;ABL收益在并发(C6+38%),单流微亏(-3%);SAM=decode再补C1/C6各~2-4%,accept分布不变;mamba-radix-cache-strategy为别名键只能走CLI flag
#   定档(2026-09-11 round5): 回滚锚点=仓库 config/baseline/ 对 + CT112:/root/backups/sglang-frozen-round5-20260911.tar.gz（中间态 .bak 已清理，仓库 git 历史即演进记录）
# --- Network ---
host: 0.0.0.0
port: 8000

# --- Device & Parallelism ---
device: cuda
tensor-parallel-size: 1
dtype: bfloat16
kv-cache-dtype: nvfp4

# --- Attention Backends (SM120 关键，与现役一致) ---
prefill-attention-backend: triton
decode-attention-backend: trtllm_mha
linear-attn-decode-backend: flashinfer
linear-attn-prefill-backend: flashinfer   # GDN prefill -> FlashInferGDNKernel (对齐 pennyroyal; 自动解析在 SM120 走 SM100-only 判断会回落 triton)

# --- Quantization ---
quantization: modelopt_fp4

# --- Memory ---
mem-fraction-static: 0.96
max-total-tokens: 2202048                  # 09-11 晚 棣民定 ≥2202010→向上页对齐 2202048;
                                          # 2477312 实炸: late-load kernel 税 4.25GB
                                          # (free 4.39→0.14, 21:17 冷灌+708MB 分配 OOM
                                          # SIGKILL); 本值回收 1.79GB → 稳态 free ≈1.9GB
                                          # 旧注释: 2,359,296(恰=9×256K,零余量) × 1.05 防溢出 = 2,477,260.8 → 64页对齐 2,477,312（+118,016 tok slack ≈ 每会话 9.8K 生成余量）。nvfp4 几何实测 6,969 B/token（boot 16.44GB/池）→ 成本 +0.82GB，fence 5.29→~4.47GB 仍安全。下次 nvfp4 bring-up 生效
context-length: 1048576                    # YaRN x4; override in json-model-override-args
max-running-requests: 12
max-prefill-tokens: 16384
chunked-prefill-size: 4096

# --- Scheduler (QSA hybrid) ---
schedule-policy: lpm
max-mamba-cache-size: 64                # conc12 x 4/req CONSTANT + 16 anchor slack (fp8kv cached0 lesson, G2X gate 2026-09-10: 3x233K all-hit 0.5s, C12 608 tok/s no regression; int8 ckpt auto 128 slots 3.74GB, avail 5.29GB)
mamba-max-states-per-path: 16           # cached0 ROOT FIX 2026-09-11: cap per-path mamba checkpoints so N long chains coexist in the 128-slot int8 pool. E3 probe: chunked-prefill donates 1 ckpt/4096 tok (549K chain=134>128 slots -> mutual eviction -> cached=0). cap16: D2 2x549K reask 89s->0.9s full hit. Whole-doc reuse unaffected; mid-doc deep branching loses depth (self-heals). Cost=0
                                          # EXPLICIT PRECONDITION (audit R2): int8 ckpt pool = 2x max-mamba-cache-size(64) = 128 slots; cap16 -> at most 8 deep chains coexist (128/16). Under max-running-requests=12, IF >8 concurrent 500K+ deep chains share the tail, mutual eviction -> cached=0 can still reappear at the margin. Current real workload has deep chains <=3, safe margin ~2.7x. fp8kv side closes exactly: conc8 x cap16 = 8x16=128 = pool, no gap. If deep-chain concurrency ever exceeds 8, lower this cap (~10) or raise max-mamba-cache-size.

gdn-mtp-cache-mode: none

# --- Mamba / GDN ---
mamba-ssm-dtype: bfloat16
mamba-track-interval: 64

# --- CUDA Graph ---
cuda-graph-config:
  decode:
    bs: [1, 2, 4, 6, 8, 10, 12]
    max_bs: 12   # conc12 trial 2026-09-10
  prefill:
    backend: full          # 09-11 与 fp8kv 统一意图声明（round-2 定档项#4：强制 full 绕开 Breakable×multimodal 自动禁用，#28386 一类，prefill ≈10K 无抖动）。现状诚实注：spec/EAGLE 在线时上游 #28386 守卫会临时关回（journal 见 "Disable prefill CUDA graph for EAGLE target"），启动 timings 里 prefill=0.00；守卫解除或关 spec 即自动生效。捕获开销 ~0.56GB/30s
    max_bs: 4096           # 对齐 chunked-prefill-size

# --- Speculative decoding NEXTN ---
speculative-algorithm: NEXTN
speculative-num-steps: 2
speculative-eagle-topk: 1
speculative-num-draft-tokens: 3
speculative-draft-model-quantization: unquant
speculative-attention-mode: decode   # verify/draft 走 decode 注意力路径(trtllm_mha/XQA), 替代默认 prefill 路径
speculative-token-map: /opt/sglang-config/frspec_map_64k.pt   # FR-Spec: 自建 65536 中文增强热表(coverage 1.0); map hash 进 cache namespace,自动隔离旧 prefix cache

# --- RoPE YaRN x4 (1M) ---
json-model-override-args:
  text_config:
    rope_parameters:
      mrope_interleaved: true
      mrope_section: [11, 11, 10]
      rope_type: yarn
      rope_theta: 10000000
      partial_rotary_factor: 0.25
      factor: 4.0
      original_max_position_embeddings: 262144

# --- Streaming ---
stream-interval: 1
watchdog-timeout: 1800

# --- Chat Template ---
chat-template: /mnt/GLOWAY_YCT2TNVMe_202732/models/sglang_models/dealignai_Qwen3.8-Flash-Next-ABLITERATED-NVFP4/chat_template_froggeric_v22.5.jinja

# --- Parsers ---
reasoning-parser: qwen3
tool-call-parser: qwen3_coder

# --- Misc ---
sleep-on-idle: true
served-model-name: Qwen3.8-Flash-Next-NVFP4

# --- HiCache OFF (fp4 硬约束，见文件头) ---
enable-hierarchical-cache: false

enable-metrics: true
