# SGLang dealignai Qwen3.8-Flash-Next — FP8 KV 方案 (fp8kv)
# conc4 / 512K / fp8 KV / MTP steps=3 / mamba 24 / radix ON / HiCache ON / GDN=flashinfer双端 / prefill CG=full / SAM=decode / FR-Spec表 / ABL=lazy(CLI)
#   2026-09-08 移植 nvfp4kv 调优项 1/3/4/5/6；steps 保持 3（fp8 accept len 实测 2.08-2.50 高于 nvfp4，深度投机在 fp8 批次形状下仍是甜点）
#   port 8000；served-model-name Qwen3.8-Flash-Next-NVFP4（Hindsight 路由键，禁改）
#   HiCache L2：ratio 2.0 / page_first / kernel io / write_through（fp8 下安全，nvfp4 下禁用）
#   ctx 524288 = YaRN x2；max-total-tokens 552960 pinned（池后留 ~6GB 给 fp8 copies + graphs）
#   性能账本：C1≈200 t/s / accept len 2.08-2.50（warmup 后 late-load 0）
#   与 nvfp4kv 方案互斥（单 GPU + PLE pinned 44GB），同时只跑一个；当前 disabled，作回滚方案保留
#   unit 仅剩 YAML 合并器不支持的两项 CLI：--ple-offload-embedding / --mamba-radix-cache-strategy
# --- Network ---
host: 0.0.0.0
port: 8000

# --- Device & Parallelism ---
device: cuda
tensor-parallel-size: 1
dtype: bfloat16
kv-cache-dtype: fp8_e4m3

# --- Attention Backends (SM120 关键) ---
prefill-attention-backend: triton
decode-attention-backend: trtllm_mha
linear-attn-decode-backend: flashinfer   # GDN decode -> FlashInfer (state-pool bf16)
linear-attn-prefill-backend: flashinfer   # GDN prefill 同步切 FlashInferGDNKernel：SM120 自动解析走 SM100-only 判断会回落 triton，必须显式双端指定（nvfp4kv 同款，prefill ≈10K t/s 的主来源）

# --- Quantization ---
quantization: modelopt_fp4

# --- Memory ---
mem-fraction-static: 0.96
max-total-tokens: 552960                # pinned: leave ~6GB post-pool headroom for fp8 copies + graphs
context-length: 524288                  # YaRN x2 (override 见 json-model-override-args)
max-running-requests: 4
max-prefill-tokens: 16384
chunked-prefill-size: 4096              # 1024 -> 4096, prefill 吞吐主提升

# --- Scheduler (QSA hybrid) ---
schedule-policy: lpm
max-mamba-cache-size: 24                # ~6x maxreq
gdn-mtp-cache-mode: none                # T1: skip intermediate h-state caching, reconstruct after verify
# ReplaySSM 已评估并放弃：上游校验 (server_args.py _handle_linear_replayssm) 要求
# linear-attn-decode-backend=triton，与 flashinfer GDN decode 互斥；flashinfer 收益已定档，不换。

# --- Mamba / GDN (migrated from systemd 2026-09-07) ---
mamba-ssm-dtype: bfloat16               # SM100+ linear-attn-decode-backend=flashinfer 硬依赖，缺失即启动 ValueError
mamba-track-interval: 64

# --- CUDA Graph (migrated; 等价替代 --cuda-graph-bs-decode 1 2 4 / --cuda-graph-max-bs-decode=4) ---
cuda-graph-config:
  decode:
    bs: [1, 2, 4]
    max_bs: 4
  prefill:
    backend: full          # 强制 full 捕获绕开 Breakable×multimodal 自动禁用（nvfp4kv 同款，#28386）
    max_bs: 4096           # 对齐 chunked-prefill-size；捕获开销 ~0.56GB / ~30s

# --- Speculative decoding NEXTN (migrated from systemd) ---
speculative-algorithm: NEXTN
speculative-num-steps: 2                      # steps2/draft3 CONFIRMED on cold pool (2026-09-10 A/B, 2 rounds/arm): C4 agg 437.6/430.8 vs steps3 285.8/200.1 — decisive; C1 noise-band (cold pool eager-adjacent variance), accept len 1.93-2.30 vs 2.35-3.07 but wall-clock wins. was steps3/draft4 (2026-09-08, pre-cold-pool). Backup .bak-steps3-fp8.
speculative-eagle-topk: 1
speculative-num-draft-tokens: 3   # paired with steps=2 (arm B); was 4 with steps=3
speculative-draft-model-quantization: unquant
speculative-attention-mode: decode   # verify/draft 走 decode 注意力路径(trtllm_mha/XQA)，不影响真实 prefill 批次（仍 triton）；C1/C6 各 +2-4%
speculative-token-map: /opt/sglang-config/frspec_map_64k.pt   # FR-Spec 中文增强热表（与 nvfp4kv 共用同一份 .pt；map hash 进 cache namespace，换表后预热 2-3 轮）

# --- RoPE YaRN x2 (migrated from systemd --json-model-override-args) ---
json-model-override-args:
  text_config:
    rope_parameters:
      mrope_interleaved: true
      mrope_section: [11, 11, 10]
      rope_type: yarn
      rope_theta: 10000000
      partial_rotary_factor: 0.25
      factor: 2.0
      original_max_position_embeddings: 262144

# --- Streaming ---
stream-interval: 1
watchdog-timeout: 1800

# --- Chat Template (第三方 v22.5, 独立文件不碰原版) ---
chat-template: ${MODEL_DIR}/chat_template_froggeric_v22.5.jinja

# --- Parsers ---
reasoning-parser: qwen3
tool-call-parser: qwen3_coder

# --- Misc ---
sleep-on-idle: true
served-model-name: Qwen3.8-Flash-Next-NVFP4

# --- HiCache L2 (pilot re-test 2026-09-06, unified radix tree) ---
enable-hierarchical-cache: true
hicache-ratio: 2.0
hicache-mem-layout: page_first
hicache-io-backend: kernel
hicache-write-policy: write_through

enable-metrics: true
