# SGLang dealignai Qwen3.8-Flash-Next — FP8 KV 方案 (fp8kv)
# conc8 / 1M / fp8 KV / MTP steps=2 / mamba 48 + 每路径帽16 / radix ON / HiCache OFF / cold pool keep330+16 / GDN=flashinfer双端 / prefill CG=full / SAM=decode / FR-Spec表 / ABL=lazy(CLI)
#   2026-09-11 定档变更：ctx 524288→1048576（YaRN x4），KV 池 1310720→1651520 = (1x1M + 2x256K) × 1.05 防溢出（棣民要求 ≥5% 缓存余量，78,656 tok ≈ 每会话 26K gen slack）；conc4→8（主会话并行喂 Hindsight/MoviePilot 小请求，decode CG 桶 [1,2,4]→[1,2,4,6,8]）
#     账本：fp8 KV 几何 12 层 full-attn ×12288B/tok → 1,651,520 tok ≈20.29GB；最后开机 capture 后 avail 8.41GB；
#     扩池 -4.19GB + conc8 新增 CG 桶 -0.3~0.6GB → 预期 fence ≈3.6-3.9GB（bring-up 时以 avail mem 行为准，<2.5GB 则回退 bs[1,2,4,6]）
#     ⚠️ 未验项：YaRN x4 在 fp8 KV 下无 NIAH 背书（nvfp4 的 x4 已验）——下次 bring-up 必须 NIAH@1M 补验
#   2x1M 双开已否决：需求 25.77GB > 16.11+8.41GB，差 1.25GB，拆东墙(mamba32+slots8)后 fence 剩 1.75GB 属自杀
#   历史：2026-09-08 移植 nvfp4kv 调优项；steps 3→2（09-10 A/B：C4 431-438 胜 steps3）；HiCache 由 ON 改 OFF 系 int8 ckpt fail-fast（server_args.py:6333）
#   port 8000；served-model-name Qwen3.8-Flash-Next-NVFP4（Hindsight 路由键，禁改）
#   与 nvfp4kv 方案互斥（单 GPU + PLE pinned 44GB），同时只跑一个；当前 disabled，作回滚方案保留
#   unit 仅剩 YAML 合并器不支持的两项 CLI：--ple-offload-embedding / --mamba-radix-cache-strategy
# --- Network ---
host: 0.0.0.0
port: 8000

# --- Device & Parallelism ---
device: cuda
tensor-parallel-size: 1
dtype: bfloat16
kv-cache-dtype: fp8_e4m3

# --- Attention Backends (SM120 关键) ---
prefill-attention-backend: triton
decode-attention-backend: trtllm_mha
linear-attn-decode-backend: flashinfer   # GDN decode -> FlashInfer (state-pool bf16)
linear-attn-prefill-backend: flashinfer   # GDN prefill 同步切 FlashInferGDNKernel：SM120 自动解析走 SM100-only 判断会回落 triton，必须显式双端指定（nvfp4kv 同款，prefill ≈10K t/s 的主来源）

# --- Quantization ---
quantization: modelopt_fp4

# --- Memory ---
mem-fraction-static: 0.96
max-total-tokens: 1651520                # 2026-09-11: (1x1M + 2x256K = 1,572,864) × 1.05 防溢出余量 = 1,651,520（64 页对齐，slack 78,656 tok）; ≈20.29GB pool, fence ≈4.2GB post-boot (nvfp4kv 5.29GB 同档); was 1310720 = 2x524K
context-length: 1048576                  # YaRN x4 (was x2/512K, 09-11); override 见 json-model-override-args；fp8 下 x4 待 NIAH@1M 补验
max-running-requests: 8                 # 09-11: conc4→8（主 1M 会话时并行吃 Hindsight/MoviePilot 小请求）；显存增量 <50MB，mamba 8×4=32 ≤48-16 slack ✓，int8 池 3×16 长链 + 小请求 ≤4 份/路 < 96 ✓
max-prefill-tokens: 16384
chunked-prefill-size: 4096              # 1024 -> 4096, prefill 吞吐主提升

# --- Scheduler (QSA hybrid) ---
schedule-policy: lpm
max-mamba-cache-size: 48                # anchor-slot ladder: 24 starved 3x336K radix reuse, 48 for anchor LRU headroom; int8 ckpt auto-sizes 2x
mamba-max-states-per-path: 16             # cached0 root fix (same as nvfp4kv 09-11): cap per-path ckpt slots; 3x336K all-miss case belongs to THIS family
gdn-mtp-cache-mode: none                # T1: skip intermediate h-state caching, reconstruct after verify
# ReplaySSM 已评估并放弃：上游校验 (server_args.py _handle_linear_replayssm) 要求
# linear-attn-decode-backend=triton，与 flashinfer GDN decode 互斥；flashinfer 收益已定档，不换。

# --- Mamba / GDN (migrated from systemd 2026-09-07) ---
mamba-ssm-dtype: bfloat16               # SM100+ linear-attn-decode-backend=flashinfer 硬依赖，缺失即启动 ValueError
mamba-track-interval: 64

# --- CUDA Graph (migrated; 等价替代 --cuda-graph-bs-decode 1 2 4 / --cuda-graph-max-bs-decode=4) ---
cuda-graph-config:
  decode:
    bs: [1, 2, 4, 6, 8]                 # 09-11 随 conc8 扩桶（capture 增量 ~0.6GB 已在 4.2GB fence 预算内）
    max_bs: 8
  prefill:
    backend: full          # round-2 定档项#4：强制 full 绕开 Breakable×multimodal 自动禁用（#28386）。现状注（09-11 journal 实证）：spec/EAGLE 在线时 #28386 守卫临时关回（"Disable prefill CUDA graph for EAGLE target"，timings prefill=0.00）；守卫解除或关 spec 自动生效
    max_bs: 4096           # 对齐 chunked-prefill-size；捕获开销 ~0.56GB / ~30s

# --- Speculative decoding NEXTN (migrated from systemd) ---
speculative-algorithm: NEXTN
speculative-num-steps: 2   # AB test arm steps2 2026-09-10
speculative-eagle-topk: 1
speculative-num-draft-tokens: 3   # AB test arm steps2
speculative-draft-model-quantization: unquant
speculative-attention-mode: decode   # verify/draft 走 decode 注意力路径(trtllm_mha/XQA)，不影响真实 prefill 批次（仍 triton）；C1/C6 各 +2-4%
speculative-token-map: /opt/sglang-config/frspec_map_64k.pt   # FR-Spec 中文增强热表（与 nvfp4kv 共用同一份 .pt；map hash 进 cache namespace，换表后预热 2-3 轮）

# --- RoPE YaRN x4 (09-11 随 ctx 1M 升级；原 x2 迁移自 systemd --json-model-override-args) ---
json-model-override-args:
  text_config:
    rope_parameters:
      mrope_interleaved: true
      mrope_section: [11, 11, 10]
      rope_type: yarn
      rope_theta: 10000000
      partial_rotary_factor: 0.25
      factor: 4.0
      original_max_position_embeddings: 262144

# --- Streaming ---
stream-interval: 1
watchdog-timeout: 1800

# --- Chat Template (第三方 v22.5, 独立文件不碰原版) ---
chat-template: /mnt/GLOWAY_YCT2TNVMe_202732/models/sglang_models/dealignai_Qwen3.8-Flash-Next-ABLITERATED-NVFP4/chat_template_froggeric_v22.5.jinja

# --- Parsers ---
reasoning-parser: qwen3
tool-call-parser: qwen3_coder

# --- Misc ---
sleep-on-idle: true
served-model-name: Qwen3.8-Flash-Next-NVFP4

# --- HiCache L2: OFF（与 int8 mamba ckpt 上游 fail-fast 互斥 server_args.py:6333）---
# enable-hierarchical-cache / hicache-* 全族禁用；历史 pilot 参数归档 git：
#   hicache-ratio 2.0 / page_first / kernel / write_through（2026-09-06 pilot，fp8 下曾安全，int8 ckpt 上线后让位）

enable-metrics: true
